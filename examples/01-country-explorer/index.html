<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explorador de países · vue-globe</title>
  <link rel="stylesheet" href="../../dist/vue-globe.css" />
  <link rel="stylesheet" href="../example.css" />
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.44/dist/vue.esm-browser.prod.js",
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "vue-globe": "../../dist/vue-globe.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <Globe ref="globe" :config="config" @region-hover="hovered = $event?.region" @region-click="select"
           @pointer-miss="selected = null"></Globe>
    <div class="panel">
      <h1>Explorador de países</h1>
      <p>Passe o mouse para destacar, clique para selecionar, arraste para girar.</p>
      <div class="row">
        <button v-for="c in shortcuts" :key="c.id" @click="globe.focus(c.id)">{{ c.label }}</button>
      </div>
      <div class="row">
        <select v-model="config.locale"><option v-for="l in locales" :key="l" :value="l">{{ l }}</option></select>
        <button :class="{ on: config.autoRotate }" @click="config.autoRotate = !config.autoRotate">Girar</button>
      </div>
      <div class="stat">
        <b>{{ (hovered || selected)?.name ?? 'Nenhum país' }}</b>
        <span>{{ selected ? 'Selecionado' : hovered ? 'Sob o cursor' : 'Passe o mouse sobre o globo' }}</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, computed } from 'vue'
    import { Globe } from 'vue-globe'

    createApp({
      components: { Globe },
      setup() {
        const globe = ref(null)
        const hovered = ref(null)
        const selected = ref(null)
        const config = reactive({ locale: 'pt-BR', autoRotate: true, rotateSpeed: 0.18, showClouds: false, showCells: false, camera: { lat: -10, lng: -45, distance: 6.4, fov: 40 } })
        const shortcuts = [
          { id: 'BRA', label: 'Brasil' }, { id: 'JPN', label: 'Japão' }, { id: 'ZAF', label: 'África do Sul' },
          { id: 'AUS', label: 'Austrália' }, { id: 'DEU', label: 'Alemanha' },
        ]
        const locales = ['pt-BR', 'en', 'es', 'fr', 'ja', 'ar']
        function select(e) { selected.value = e.region }
        return { globe, hovered, selected, config, shortcuts, locales, select }
      },
    }).mount('#app')
  </script>
</body>
</html>
