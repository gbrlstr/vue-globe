<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de calor do Brasil · vue-globe</title>
  <link rel="stylesheet" href="../../dist/vue-globe.css" />
  <link rel="stylesheet" href="../example.css" />
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.44/dist/vue.esm-browser.prod.js",
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "vue-globe": "../../dist/vue-globe.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <Globe ref="globe" :regions="regions" :config="config" @region-hover="hovered = $event?.region ?? null"></Globe>
    <div class="panel">
      <h1>Estados do Brasil</h1>
      <p>Cada estado é uma <code>Region</code> com a propriedade <code>fill</code>. Troque o mapa de cores abaixo.</p>
      <div class="row">
        <button :class="{ on: mode === 'density' }" @click="mode = 'density'">Densidade demográfica</button>
        <button :class="{ on: mode === 'macro' }" @click="mode = 'macro'">Macrorregiões</button>
      </div>
      <label class="range">Opacidade <input type="range" min="0.2" max="1" step="0.05" v-model.number="config.regionOpacity" /></label>
      <div class="stat">
        <template v-if="hovered">
          <b>{{ hovered.name }}</b>
          <span v-if="hovered.data">{{ hovered.data.density.toLocaleString('pt-BR') }} hab/km² · {{ hovered.data.macro }}</span>
        </template>
        <span v-else>Passe o mouse sobre um estado</span>
      </div>
    </div>
    <div class="legend">
      <template v-if="mode === 'density'">
        Densidade (hab/km², escala logarítmica)
        <div class="bar" :style="{ background: gradient }"></div>
        <div class="ticks"><span>2</span><span>10</span><span>100</span><span>500</span></div>
      </template>
      <template v-else>
        <div v-for="(color, name) in macros" :key="name" style="display:inline-block;margin-right:12px">
          <i class="swatch" :style="{ background: color }"></i>{{ name }}
        </div>
      </template>
    </div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, computed } from 'vue'
    import { Globe } from 'vue-globe'

    // Mesma malha usada pelo globo: ela traz os estados do Brasil com a densidade de cada um.
    const WORLD = new URL('../../dist/assets/data/world-main.json', import.meta.url)

    const MACRO = {
      Norte: ['AC', 'AM', 'AP', 'PA', 'RO', 'RR', 'TO'],
      Nordeste: ['AL', 'BA', 'CE', 'MA', 'PB', 'PE', 'PI', 'RN', 'SE'],
      'Centro-Oeste': ['DF', 'GO', 'MT', 'MS'],
      Sudeste: ['ES', 'MG', 'RJ', 'SP'],
      Sul: ['PR', 'RS', 'SC'],
    }
    const macros = { Norte: '#2fbf71', Nordeste: '#f5a623', 'Centro-Oeste': '#9b6bff', Sudeste: '#e1251b', Sul: '#2d9cdb' }
    const macroOf = (uf) => Object.keys(MACRO).find((m) => MACRO[m].includes(uf))

    // Rampa sequencial: amarelo claro, laranja, vermelho, vinho.
    const STOPS = ['#fff1b8', '#fdb863', '#e1251b', '#5b0a1f']
    function densityColor(d) {
      const t = Math.min(1, Math.max(0, (Math.log10(d) - Math.log10(2)) / (Math.log10(500) - Math.log10(2))))
      const x = t * (STOPS.length - 1)
      const i = Math.min(STOPS.length - 2, Math.floor(x))
      return `color-mix(in srgb, ${STOPS[i + 1]} ${Math.round((x - i) * 100)}%, ${STOPS[i]})`
    }

    createApp({
      components: { Globe },
      setup() {
        const base = ref([])
        const mode = ref('density')
        const hovered = ref(null)
        const globe = ref(null)
        const config = reactive({
          autoRotate: false, showClouds: false, showCells: false, regionOpacity: 0.9,
          camera: { lat: -14, lng: -52, distance: 4.4, fov: 40 },
        })

        fetch(WORLD).then((r) => r.json()).then((features) => {
          base.value = features
            .filter((f) => f.properties.code === 'BRA')
            .map((f) => ({
              id: 'BR-' + f.properties.state,
              name: f.properties.name,
              geometry: f.geometry,
              data: { density: f.properties.density, macro: macroOf(f.properties.state) },
            }))
        })

        const regions = computed(() =>
          base.value.map((r) => ({ ...r, fill: mode.value === 'density' ? densityColor(r.data.density) : macros[r.data.macro] })),
        )
        const gradient = `linear-gradient(90deg, ${STOPS.join(', ')})`
        return { globe, regions, config, mode, hovered, macros, gradient }
      },
    }).mount('#app')
  </script>
</body>
</html>
