<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cidades com marcadores · vue-globe</title>
  <link rel="stylesheet" href="../../dist/vue-globe.css" />
  <link rel="stylesheet" href="../example.css" />
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.44/dist/vue.esm-browser.prod.js",
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "vue-globe": "../../dist/vue-globe.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <Globe ref="globe" :markers="cities" :config="config" @marker-click="pick" @pointer-miss="current = null"></Globe>
    <div class="panel">
      <h1>Cidades com marcadores</h1>
      <p>Clique em um pino, ou use a lista, para levar a câmera até a cidade.</p>
      <div class="row">
        <button v-for="c in cities" :key="c.id" :class="{ on: current?.id === c.id }" @click="pick(c)">{{ c.label }}</button>
      </div>
      <div class="row">
        <select v-model="config.markerLabels">
          <option value="always">Rótulos: sempre</option><option value="hover">Rótulos: ao passar o mouse</option><option value="never">Rótulos: nunca</option>
        </select>
      </div>
      <div class="stat">
        <template v-if="current"><b>{{ current.label }}</b><span>{{ current.data.country }} · {{ current.data.people }} milhões de habitantes</span></template>
        <span v-else>Nenhuma cidade selecionada</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, computed } from 'vue'
    import { Globe } from 'vue-globe'

    const cities = [
      { id: 'fortaleza', lat: -3.73, lng: -38.52, label: 'Fortaleza', data: { country: 'Brasil', people: 2.7 } },
      { id: 'sao-paulo', lat: -23.55, lng: -46.63, label: 'São Paulo', data: { country: 'Brasil', people: 12.3 } },
      { id: 'lisboa', lat: 38.72, lng: -9.14, label: 'Lisboa', color: '#4ade80', data: { country: 'Portugal', people: 0.55 } },
      { id: 'nova-york', lat: 40.71, lng: -74.0, label: 'Nova York', color: '#4ade80', data: { country: 'Estados Unidos', people: 8.3 } },
      { id: 'cidade-do-cabo', lat: -33.92, lng: 18.42, label: 'Cidade do Cabo', color: '#60a5fa', data: { country: 'África do Sul', people: 4.7 } },
      { id: 'toquio', lat: 35.68, lng: 139.69, label: 'Tóquio', color: '#f472b6', data: { country: 'Japão', people: 14.0 } },
      { id: 'sydney', lat: -33.87, lng: 151.21, label: 'Sydney', color: '#f472b6', data: { country: 'Austrália', people: 5.3 } },
    ]

    createApp({
      components: { Globe },
      setup() {
        const globe = ref(null)
        const current = ref(null)
        const config = reactive({ markerLabels: 'always', markerSize: 0.045, autoRotate: true, rotateSpeed: 0.12, showClouds: false, showCells: false, camera: { lat: 10, lng: -30, distance: 6.4, fov: 40 } })
        function pick(marker) {
          current.value = marker
          config.autoRotate = false
          globe.value.focus(marker.id)
        }
        return { globe, cities, current, config, pick }
      },
    }).mount('#app')
  </script>
</body>
</html>
