<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Population heatmap · vue-globe</title>
  <link rel="stylesheet" href="../../dist/vue-globe.css" />
  <link rel="stylesheet" href="../example.css" />
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.44/dist/vue.esm-browser.prod.js",
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "vue-globe": "../../dist/vue-globe.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <Globe :regions="regions" :config="config" @region-hover="hovered = $event?.region ?? null"></Globe>
    <div class="panel">
      <h1>Population heatmap</h1>
      <p>Population of the 80 largest countries, colored on a logarithmic scale. Approximate figures, around 2023.</p>
      <div class="row">
        <button :class="{ on: config.autoRotate }" @click="config.autoRotate = !config.autoRotate">Rotate</button>
        <button :class="{ on: config.showGrid }" @click="config.showGrid = !config.showGrid">Grid</button>
      </div>
      <label class="range">Opacity <input type="range" min="0.2" max="1" step="0.05" v-model.number="config.regionOpacity" /></label>
      <div class="stat">
        <template v-if="hovered?.data"><b>{{ hovered.name }}</b><span>{{ hovered.data.pop.toLocaleString('en-US') }} million people</span></template>
        <span v-else>Hover a colored country</span>
      </div>
    </div>
    <div class="legend">
      Population (millions, log scale)
      <div class="bar" :style="{ background: gradient }"></div>
      <div class="ticks"><span>1</span><span>10</span><span>100</span><span>1,000</span></div>
    </div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, computed } from 'vue'
    import { Globe } from 'vue-globe'

    const WORLD = new URL('../../dist/assets/data/world-main.json', import.meta.url)

    // [ISO 3166-1 alpha-3, name, population in millions, approximate, around 2023]
    const DATA = [
      ['CHN','China',1410],['IND','India',1429],['USA','United States',335],['IDN','Indonesia',277],['PAK','Pakistan',240],
      ['NGA','Nigeria',224],['BRA','Brazil',216],['BGD','Bangladesh',173],['RUS','Russia',144],['MEX','Mexico',128],
      ['ETH','Ethiopia',126],['JPN','Japan',124],['PHL','Philippines',117],['EGY','Egypt',112],['COD','DR Congo',102],
      ['VNM','Vietnam',99],['IRN','Iran',89],['TUR','Türkiye',85],['DEU','Germany',84],['THA','Thailand',72],
      ['GBR','United Kingdom',68],['FRA','France',68],['TZA','Tanzania',67],['ZAF','South Africa',60],['ITA','Italy',59],
      ['KEN','Kenya',55],['MMR','Myanmar',54],['KOR','South Korea',52],['COL','Colombia',52],['ESP','Spain',48],
      ['UGA','Uganda',48],['ARG','Argentina',46],['DZA','Algeria',45],['SDN','Sudan',48],['UKR','Ukraine',37],
      ['IRQ','Iraq',45],['AFG','Afghanistan',42],['POL','Poland',37],['CAN','Canada',40],['MAR','Morocco',37],
      ['SAU','Saudi Arabia',36],['UZB','Uzbekistan',35],['PER','Peru',34],['AGO','Angola',36],['MYS','Malaysia',34],
      ['MOZ','Mozambique',33],['GHA','Ghana',34],['YEM','Yemen',34],['NPL','Nepal',30],['VEN','Venezuela',29],
      ['MDG','Madagascar',30],['CMR','Cameroon',28],['CIV','Côte d’Ivoire',28],['PRK','North Korea',26],['AUS','Australia',26],
      ['NER','Niger',27],['LKA','Sri Lanka',22],['BFA','Burkina Faso',23],['MLI','Mali',23],['ROU','Romania',19],
      ['MWI','Malawi',20],['CHL','Chile',19.5],['KAZ','Kazakhstan',20],['ZMB','Zambia',20],['GTM','Guatemala',18],
      ['ECU','Ecuador',18],['SYR','Syria',23],['NLD','Netherlands',17.6],['SEN','Senegal',17.7],['KHM','Cambodia',16.9],
      ['TCD','Chad',18],['SOM','Somalia',18],['ZWE','Zimbabwe',16],['GIN','Guinea',14],['RWA','Rwanda',14],
      ['BEN','Benin',13],['BDI','Burundi',13],['TUN','Tunisia',12],['BOL','Bolivia',12],['BEL','Belgium',11.7],
      ['HTI','Haiti',11.7],['CUB','Cuba',11],['GRC','Greece',10.4],['PRT','Portugal',10.3],['SWE','Sweden',10.5],
    ]
    const POP = new Map(DATA.map(([code, name, pop]) => [code, { name, pop }]))

    // Sequential ramp from dark blue to yellow-white.
    const STOPS = ['#1b2b6b', '#3a47b8', '#a43fb5', '#f2603c', '#ffd23f', '#fff8d6']
    const MIN = Math.log10(1), MAX = Math.log10(1500)
    function color(pop) {
      const t = Math.min(1, Math.max(0, (Math.log10(pop) - MIN) / (MAX - MIN)))
      const x = t * (STOPS.length - 1), i = Math.min(STOPS.length - 2, Math.floor(x))
      return `color-mix(in srgb, ${STOPS[i + 1]} ${Math.round((x - i) * 100)}%, ${STOPS[i]})`
    }

    createApp({
      components: { Globe },
      setup() {
        const regions = ref([])
        const hovered = ref(null)
        const config = reactive({
          autoRotate: true, rotateSpeed: 0.1, showClouds: false, showCells: false, regionOpacity: 0.92,
          camera: { lat: 22, lng: 85, distance: 6.4, fov: 40 },
        })
        fetch(WORLD).then((r) => r.json()).then((features) => {
          regions.value = features
            .filter((f) => POP.has(f.properties.code))
            .map((f, i) => {
              const info = POP.get(f.properties.code)
              return { id: `${f.properties.code}-${i}`, name: info.name, geometry: f.geometry, fill: color(info.pop), data: info }
            })
        })
        return { regions, hovered, config, gradient: `linear-gradient(90deg, ${STOPS.join(', ')})` }
      },
    }).mount('#app')
  </script>
</body>
</html>
